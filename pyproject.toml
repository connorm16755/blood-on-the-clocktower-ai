[project]
name = "blood-on-the-clocktower-ai"
version = "0.1.0"
description = "AI-powered Blood on the Clocktower game"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.8.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.92.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["game_engine*", "ai_agents*", "role_registry*", "api*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
